name: CI and SAST

on:
  push:
    branches:
      - main
      - feature-calculator
      - feature-improved-output
  pull_request:
    branches:
      - main

jobs:
  build-test-sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build application
        run: python -m py_compile calculator.py

      - name: Run unit tests
        run: python -m unittest test_calculator.py

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run SAST with Bandit
        run: bandit -r . -ll
